<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SF Roadster Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800;900&family=Chivo+Mono:wght@400;500;600;700&family=Rozha+One&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  :root { --boot-bg: #070b16; --boot-fg: #e9eef8; color-scheme: dark; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--boot-bg); color: var(--boot-fg); }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; }
  #boot-error { position: fixed; inset: auto 16px 16px 16px; font: 14px/1.4 system-ui, sans-serif; color: #ffd2c2; display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<canvas id="game"></canvas>
<div id="ui"></div>
<div id="boot-error" role="alert"></div>
<script>
  addEventListener('error', e => {
    const el = document.getElementById('boot-error');
    if (el && e.message) { el.style.display = 'block'; el.textContent = 'Error: ' + e.message; }
  });
</script>
<script type="module" src="src/main.js"></script>
